<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Administration — Alfred-EA</title>
  <style>
    :root{--bg:#030303;--panel:#0b111b;--gold:#dbb453;--gold2:#f2d47d;--text:#f6f3eb;--muted:#969590;--line:rgba(219,180,83,.25)}*{box-sizing:border-box}body{margin:0;background:#030303;color:var(--text);font-family:Arial,sans-serif;line-height:1.5}.top{border-bottom:1px solid var(--gold);padding:20px 5%;display:flex;justify-content:space-between;align-items:center}.top a{color:var(--gold2);text-decoration:none;font-weight:800}.page{width:min(1180px,calc(100% - 28px));margin:38px auto}.head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.18em}.head h1{margin:7px 0;font-size:34px}.button{border:1px solid var(--line);background:#080d15;color:var(--gold2);border-radius:999px;padding:11px 17px;cursor:pointer}.grid{display:grid;grid-template-columns:320px 1fr;gap:14px}.panel{background:linear-gradient(145deg,#0c121d,#060a11);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:20px}.panel h2{font-size:17px;margin:0 0 15px}.client{width:100%;text-align:left;border:0;border-top:1px solid rgba(255,255,255,.07);background:transparent;color:var(--text);padding:13px 4px;cursor:pointer}.client:hover,.client.active{color:var(--gold2)}.client small{display:block;color:var(--muted);margin-top:3px}.section{margin-top:24px}.row{border-top:1px solid rgba(255,255,255,.07);padding:13px 0}.row strong,.row small{display:block}.row small,.muted{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.secret{margin-top:14px;padding:15px;border:1px solid var(--gold);border-radius:12px;background:#05080d}.secret input{width:100%;margin:8px 0;border:1px solid var(--line);background:#030303;color:var(--gold2);padding:12px;border-radius:9px}.status{color:var(--gold2)}[hidden]{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
    .demo-client{border:1px solid var(--gold);border-radius:11px;padding:13px;margin-bottom:10px;background:rgba(219,180,83,.06)}.credential-gate,.account-secret{display:grid;gap:8px;width:100%;margin-top:8px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#05080d}.credential-gate label{font-size:11px;color:var(--gold2)}.credential-gate input,.account-secret input{width:100%;border:1px solid var(--line);background:#030303;color:var(--gold2);padding:11px;border-radius:8px}.account-secret small{color:var(--muted)}
  </style>
</head>
<body><header class="top"><a href="index.html">ALFRED-EA</a><a href="admin.html">Administration</a></header>
<main class="page"><div class="head"><div><div class="eyebrow">ACCÈS RESTREINT</div><h1>Administration Alfred-EA</h1><p class="muted">Dossiers clients et transmissions MT5 temporaires.</p></div><button class="button" id="logout">Déconnexion</button></div>
  <p class="status" id="status">Vérification de votre accès…</p>
  <div class="grid" id="adminGrid" hidden><aside class="panel"><h2>Clients</h2><div id="clients"></div></aside><section class="panel"><h2 id="clientTitle">Sélectionnez un client</h2><div id="clientDetails"></div></section></div>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js?v=5"></script></body></html>
